name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite (stdlib fallback only, no psutil)
        run: python -m unittest discover -s tests -t . -v

      - name: Install psutil
        run: python -m pip install -r requirements.txt

      - name: Run test suite (with psutil)
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test the CLI end to end
        run: |
          python -m inventory_tool --format text
          python -m inventory_tool --format json --output report.json
          python -m inventory_tool --append fleet.csv
