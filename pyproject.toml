[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-inventory-tool"
version = "1.0.0"
description = "Collects hardware, OS, storage, and network details from a machine and writes an inventory report."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mahir Mohammed Mozumder" }]

[project.optional-dependencies]
full = ["psutil>=5.9"]

[project.scripts]
inventory-tool = "inventory_tool.cli:main"

[tool.setuptools.packages.find]
include = ["inventory_tool*"]
